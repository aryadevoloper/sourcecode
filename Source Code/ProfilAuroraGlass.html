<style>
  :root{
    --text:#1e1b3a;
    --text-soft:rgba(30,27,58,.55);
    --card:rgba(255,255,255,.55);
    --card-brd:rgba(255,255,255,.65);
    --card-hover:rgba(255,255,255,.75);
    --shadow:0 8px 32px rgba(31,38,135,.10);
    --shadow-hover:0 12px 40px rgba(31,38,135,.18);
    --accent1:#8b5cf6;   /* ungu */
    --accent2:#ec4899;   /* pink */
    --accent3:#06b6d4;   /* cyan */
    --ok:#22c55e;
    --bg1:#fef3c7; --bg2:#fce7f3; --bg3:#e0e7ff; --bg4:#cffafe;
    --r:24px;
  }
  [data-theme="dark"]{
    --text:#e9e7ff;
    --text-soft:rgba(233,231,255,.6);
    --card:rgba(255,255,255,.06);
    --card-brd:rgba(255,255,255,.12);
    --card-hover:rgba(255,255,255,.10);
    --shadow:0 8px 32px rgba(0,0,0,.35);
    --shadow-hover:0 12px 40px rgba(139,92,246,.35);
    --bg1:#1e1b4b; --bg2:#4c1d95; --bg3:#0f172a; --bg4:#1e3a8a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100vh;min-height:100dvh}
  body{
    background:var(--bg3);color:var(--text);
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
    overflow-x:hidden;transition:background .4s,color .4s;position:relative;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

  /* ===== Aurora background (blob bergerak) ===== */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora::before,
  .aurora::after,
  .aurora span{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.65}
  .aurora::before{
    width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;
    background:radial-gradient(circle,var(--bg1),transparent 65%);
    animation:float1 18s ease-in-out infinite;
  }
  .aurora::after{
    width:60vmax;height:60vmax;right:-20vmax;top:20vmax;
    background:radial-gradient(circle,var(--bg2),transparent 65%);
    animation:float2 22s ease-in-out infinite;
  }
  .aurora span{width:55vmax;height:55vmax;left:20vmax;bottom:-25vmax;
    background:radial-gradient(circle,var(--bg4),transparent 65%);
    animation:float3 20s ease-in-out infinite;
  }
  [data-theme="light"] body{background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4))}
  [data-theme="dark"] body{background:linear-gradient(135deg,var(--bg3),var(--bg2),var(--bg1),var(--bg4))}
  @keyframes float1{50%{transform:translate(15vmax,10vmax) scale(1.1)}}
  @keyframes float2{50%{transform:translate(-12vmax,8vmax) scale(1.15)}}
  @keyframes float3{50%{transform:translate(8vmax,-12vmax) scale(1.05)}}

  /* ===== Ticker ===== */
  .ticker{
    position:relative;z-index:3;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--card-brd);
    overflow:hidden;white-space:nowrap;padding:9px 0;
    font:500 .74rem "JetBrains Mono",monospace;letter-spacing:1.2px;
    color:var(--text);
  }
  [data-theme="dark"] .ticker{background:rgba(255,255,255,.05)}
  .track{display:inline-block;animation:marq 26s linear infinite}
  .track span{display:inline-block;white-space:pre}
  @keyframes marq{to{transform:translateX(-50%)}}

  /* ===== Wrap ===== */
  .wrap{
    position:relative;z-index:2;width:100%;max-width:440px;margin:0 auto;text-align:center;
    padding:24px 20px calc(48px + env(safe-area-inset-bottom));
  }

  /* ===== Animasi masuk & tekan ===== */
  .pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) var(--d,0s) backwards}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
  .press{transition:transform .18s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s,background .25s}
  .press:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .press:active{transform:translateY(1px) scale(.98);box-shadow:var(--shadow)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent1);outline-offset:4px;border-radius:12px}

  /* ===== Kartu profil (glass) ===== */
  .hero{
    background:var(--card);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--card-brd);
    border-radius:var(--r);box-shadow:var(--shadow);
    padding:0 16px 26px;position:relative;overflow:hidden;
  }
  .banner{
    position:relative;height:130px;margin:0 -16px;border-bottom:1px solid var(--card-brd);
    border-radius:var(--r) var(--r) 0 0;
    background:linear-gradient(120deg,var(--accent1),var(--accent2) 50%,var(--accent3));
    background-size:200% 200%;animation:gradientShift 8s ease infinite;
  }
  @keyframes gradientShift{50%{background-position:100% 50%}}
  .banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.5),transparent 40%),
               radial-gradient(circle at 80% 70%,rgba(255,255,255,.3),transparent 45%);
  }
  .chip{
    position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;
    background:rgba(255,255,255,.75);color:#1e1b3a;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.8);border-radius:999px;
    font:500 .68rem "JetBrains Mono",monospace;white-space:nowrap;
    box-shadow:0 2px 12px rgba(31,38,135,.12);z-index:2;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.25);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,.15)}}
  .btns{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
  .sq{
    width:34px;height:34px;border:1px solid rgba(255,255,255,.8);border-radius:11px;display:grid;place-items:center;
    cursor:pointer;color:#1e1b3a;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 2px 12px rgba(31,38,135,.12);
    transition:transform .15s,box-shadow .2s;
  }
  .sq svg{width:17px;height:17px;fill:currentColor}
  .sq:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(31,38,135,.2)}
  .sq:active{transform:translateY(0) scale(.94)}
  #share{background:rgba(255,255,255,.85)}
  #tema{background:rgba(255,255,255,.85)}

  /* ===== Avatar ===== */
  .av{position:relative;z-index:2;width:116px;height:116px;margin:-58px auto 0;border-radius:50%;padding:4px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));
    box-shadow:0 8px 24px rgba(139,92,246,.3);
  }
  .av img{
    width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;background:#000;
    border:3px solid var(--card);
  }
  h1{margin-top:20px;font-size:clamp(1.6rem,7.2vw,2.15rem);line-height:1.15;letter-spacing:-.9px;font-weight:800;text-wrap:balance}
  .hl{
    display:inline-block;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    padding:0 .06em;
  }
  .handle{margin-top:10px;font:500 .86rem "JetBrains Mono",monospace;color:var(--text-soft)}
  .typer{
    display:block;width:min(100%,280px);min-height:42px;margin:16px auto 0;padding:9px 16px;
    background:rgba(255,255,255,.55);color:var(--text);
    border:1px solid var(--card-brd);border-radius:999px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 16px rgba(31,38,135,.08);
    font:500 .82rem "JetBrains Mono",monospace;line-height:1.3;text-align:center;
  }
  [data-theme="dark"] .typer{background:rgba(255,255,255,.08)}
  .typer::after{content:"▍";margin-left:2px;animation:blink 1s steps(1) infinite;color:var(--accent1)}
  @keyframes blink{50%{opacity:0}}

  /* ===== Tile sosmed ===== */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
  a.tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;padding:8px;
    text-decoration:none;color:var(--text);
    background:var(--card);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--card-brd);border-radius:var(--r);
    box-shadow:var(--shadow);
  }
  .tile .ic{
    width:46px;height:46px;border-radius:14px;
    background:var(--ic-bg,linear-gradient(135deg,var(--accent1),var(--accent2)));
    display:grid;place-items:center;
    box-shadow:0 4px 14px var(--ic-sh,rgba(139,92,246,.35));
    transition:transform .3s cubic-bezier(.2,.9,.3,1.4);
  }
  .tile:hover .ic{transform:rotate(-10deg) scale(1.1)}
  .tile .ic svg{width:23px;height:23px;fill:#fff}
  .tile .nm{font-weight:700;font-size:.88rem;line-height:1;color:var(--text)}

  /* ===== Label & saluran ===== */
  .label{margin:28px 0 12px;display:flex;align-items:center;gap:12px;color:var(--text-soft)}
  .label span{
    flex:none;background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#fff;font:600 .72rem "JetBrains Mono",monospace;letter-spacing:1px;
    text-transform:uppercase;padding:5px 14px;border-radius:8px;
    box-shadow:0 4px 14px rgba(139,92,246,.35);
  }
  .label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--card-brd),transparent);border-radius:2px}

  .chans{display:flex;flex-direction:column;gap:14px}
  a.chan{
    display:flex;align-items:center;gap:14px;padding:16px;text-align:left;text-decoration:none;color:var(--text);
    background:var(--card);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--card-brd);border-radius:var(--r);
    box-shadow:var(--shadow);
  }
  .cic{
    flex:none;width:50px;height:50px;border-radius:15px;
    background:var(--cc,linear-gradient(135deg,var(--accent1),var(--accent2)));
    display:grid;place-items:center;
    box-shadow:0 4px 14px var(--cc-sh,rgba(139,92,246,.3));
  }
  .cic svg{width:26px;height:26px;fill:#fff}
  .tt{flex:1;min-width:0}
  .tt b{display:block;font-size:1.08rem;line-height:1.15;font-weight:800;color:var(--text)}
  .tt small{
    display:block;margin-top:4px;font:500 .74rem "JetBrains Mono",monospace;color:var(--text-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arr{
    flex:none;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.55);
    border:1px solid var(--card-brd);
    color:var(--text);display:grid;place-items:center;
    transition:transform .25s,background .25s;
  }
  [data-theme="dark"] .arr{background:rgba(255,255,255,.08)}
  .arr svg{width:17px;height:17px}
  a.chan:hover .arr{
    transform:translate(3px,-3px) rotate(10deg);
    background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
  }

  footer{margin-top:38px;font:500 .7rem "JetBrains Mono",monospace;letter-spacing:1.2px;color:var(--text-soft);text-transform:uppercase}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);z-index:9;opacity:0;pointer-events:none;
    background:rgba(30,27,58,.9);color:#fff;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:10px 18px;border-radius:14px;
    box-shadow:0 8px 30px rgba(31,38,135,.35);
    font:500 .8rem "JetBrains Mono",monospace;
    transition:.35s cubic-bezier(.2,.9,.3,1.3);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:380px){
    .chip{font-size:.62rem;padding:0 10px;gap:6px}
    .btns{gap:6px}
    .aurora::before,.aurora::after,.aurora span{filter:blur(60px)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function url(u) { u = String(u || '').trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(u) ? esc(u) : '#'; }
  function safeGrad(v) {
    var s = String(v || '').trim();
    if (/^(linear|radial)-gradient\(/i.test(s) && /^[\w\s#(),.%\-]+$/i.test(s)) return s;
    if (/^#[0-9a-f]{3,8}$/i.test(s)) return s;
    return '';
  }
  function svg(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + (IKON[n] || IKON.web) + '"/></svg>'; }
  var PANAH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  function delay(i) { return (0.2 + i * 0.06).toFixed(2) + 's'; }

  document.title = C.nama;
  var nama = String(C.nama || ''), s = String(C.sorot || ''), k = s ? nama.lastIndexOf(s) : -1;
  $('#nama').innerHTML = k < 0 ? esc(nama) : esc(nama.slice(0, k)) + '<span class="hl">' + esc(s) + '</span>' + esc(nama.slice(k + s.length));
  $('#handle').textContent = C.handle || '';
  if (!C.handle) $('#handle').style.display = 'none';

  var tk = String(C.ticker || ''), n = tk ? Math.max(1, Math.ceil(140 / tk.length)) : 0;
  var rep = '<span>' + esc(new Array(n + 1).join(tk)) + '</span>';
  $('#track').innerHTML = rep + rep;
  if (!tk) $('.ticker').style.display = 'none';

  var foto = $('#foto');
  foto.src = C.foto;
  try { $('#favicon').href = C.foto; } catch (e) {}
  foto.addEventListener('error', function () {
    var ini = nama.split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 3).toUpperCase();
    this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="128" height="128" fill="url(#g)"/><text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#fff">' + esc(ini) + '</text></svg>');
  }, { once: true });

  $('#tiles').innerHTML = (C.sosmed || []).map(function (x, i) {
    var g = safeGrad(x.grad);
    var icStyle = g ? ' style="--ic-bg:' + g + '"' : '';
    return '<a class="tile press pop" style="--d:' + delay(i) + '"' +
      ' href="' + url(x.url) + '" target="_blank" rel="noopener" aria-label="' + esc(x.nama + (x.user ? ' ' + x.user : '')) + '" title="' + esc(x.user || x.nama) + '">' +
      '<span class="ic"' + icStyle + '>' + svg(x.ikon) + '</span><span class="nm">' + esc(x.nama) + '</span></a>';
  }).join('');
  if (!(C.sosmed || []).length) $('#tiles').style.display = 'none';

  var sal = C.saluran || {}, daftar = sal.daftar || [], base = (C.sosmed || []).length;
  $('#saluran').innerHTML = !daftar.length ? '' :
    (sal.label ? '<div class="label pop" style="--d:' + delay(base) + '"><span>' + esc(sal.label) + '</span></div>' : '<div style="height:28px"></div>') +
    '<div class="chans">' + daftar.map(function (c, i) {
      var g = safeGrad(c.grad);
      var icStyle = g ? ' style="--cc:' + g + '"' : '';
      return '<a class="chan press pop" style="--d:' + delay(base + 1 + i) + '" href="' + url(c.url) + '" target="_blank" rel="noopener">' +
        '<span class="cic"' + icStyle + '>' + svg(c.ikon || 'whatsapp') + '</span>' +
        '<span class="tt"><b>' + esc(c.judul) + '</b><small>' + esc(c.sub || '') + '</small></span>' +
        '<span class="arr">' + PANAH + '</span></a>';
    }).join('') + '</div>';

  $('#footer').textContent = '© ' + new Date().getFullYear() + ' ' + nama;

  function jam() {
    var j = C.jam || {}, t = 'ONLINE';
    if (j.tampil) {
      try { t += ' · ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: j.zona }).replace('.', ':') + ' ' + (j.label || ''); } catch (e) {}
    }
    $('#jam').textContent = t.trim();
  }
  jam(); setInterval(jam, 30000);

  var kata = (C.mengetik && C.mengetik.length) ? C.mengetik : [''], ki = 0, ci = 0, hapus = false, el = $('#typer');
  if (!C.mengetik || !C.mengetik.length) el.style.display = 'none';
  function ketik() {
    var w = kata[ki];
    if (reduce) { el.textContent = w; ki = (ki + 1) % kata.length; return setTimeout(ketik, 2200); }
    el.textContent = w.slice(0, ci);
    if (!hapus && ci === w.length) { hapus = true; return setTimeout(ketik, 1600); }
    if (hapus && ci === 0) { hapus = false; ki = (ki + 1) % kata.length; }
    ci += hapus ? -1 : 1;
    setTimeout(ketik, hapus ? 30 : 70);
  }
  ketik();

  function setMeta() { $('meta[name=theme-color]').content = root.dataset.theme === 'dark' ? '#1e1b4b' : '#8b5cf6'; }
  root.dataset.theme = C.tema === 'dark' ? 'dark' : 'light';
  try { var tsim = localStorage.getItem('tema'); if (tsim === 'dark' || tsim === 'light') root.dataset.theme = tsim; } catch (e) {}
  setMeta();
  $('#tema').addEventListener('click', function () {
    var baru = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = baru; setMeta();
    try { localStorage.setItem('tema', baru); } catch (e) {}
  });

  function toast(t) {
    var e = $('#toast'); e.textContent = t; e.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('show'); }, 1800);
  }
  $('#share').addEventListener('click', function () {
    if (navigator.share) { navigator.share({ title: nama, url: location.href }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { toast('LINK DISALIN ✓'); }, function () { toast('GAGAL MENYALIN'); });
    else toast('SALIN DARI ADDRESS BAR');
  });

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.press, .sq') && navigator.vibrate) { try { navigator.vibrate(8); } catch (x) {} }
  });
})();
</script>
</body>
</html>
