<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Arya Fox">
<meta name="theme-color" content="#ff7a1a">
<title>Kumpulan Link Arya</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#14110f; --ink:#14110f; --paper:#fff; --bg:#fff4e0; --mut:rgba(20,17,15,.62);
    --orange:#ff7a1a; --pink:#ff5c9a; --blue:#3b5bff; --yellow:#ffd23f; --green:#25d366;
    --grid:rgba(20,17,15,.07); --glow:rgba(255,122,26,.3);
    --bw:3px; --r:20px;
  }
  [data-theme="dark"]{
    --ink:#fff4e0; --paper:#1f1a17; --bg:#14110f; --mut:rgba(255,244,224,.62);
    --grid:rgba(255,244,224,.07); --glow:rgba(255,122,26,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
    font-family:"Outfit","Segoe UI",system-ui,sans-serif;overflow-x:hidden;transition:background .35s,color .35s;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
    background-size:32px 32px;animation:grid 8s linear infinite;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(280px circle at var(--px,50%) var(--py,28%),var(--glow),transparent 70%);
  }
  @keyframes grid{to{background-position:32px 32px}}

  .ticker{
    position:relative;z-index:3;background:var(--orange);color:var(--dark);
    border-bottom:var(--bw) solid var(--ink);
    overflow:hidden;white-space:nowrap;padding:8px 0;
    font:500 .74rem "DM Mono",monospace;letter-spacing:1.2px;
  }
  .track{display:inline-block;animation:marq 26s linear infinite}
  .track span{display:inline-block;white-space:pre}
  @keyframes marq{to{transform:translateX(-50%)}}

  /* ===== Topbar ===== */
  .topbar{
    position:relative;z-index:5;display:flex;align-items:center;
    gap:10px;
    max-width:440px;margin:0 auto;padding:16px 20px 8px;
  }
  .back{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:40px;padding:0 12px;
    background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:12px;
    text-decoration:none;font-weight:800;font-size:.82rem;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    flex:none;
  }
  .back svg{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .back:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .back:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

  /* ===== Channel Resmi WA - memanjang penuh ===== */
  .join{
    flex:1 1 auto;min-width:0;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:40px;padding:0 12px;
    background:var(--green);color:var(--dark);
    border:var(--bw) solid var(--ink);border-radius:12px;
    text-decoration:none;font-weight:800;font-size:.8rem;letter-spacing:.2px;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    white-space:nowrap;overflow:hidden;
  }
  .join svg{width:17px;height:17px;flex:none;fill:currentColor}
  .join .txt{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.6px;
  }
  .join:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .join:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

  .sq{
    width:40px;height:40px;flex:none;border:var(--bw) solid var(--ink);border-radius:12px;
    background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;position:relative;
  }
  .sq svg{width:20px;height:20px;position:absolute}
  .sq:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .sq:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .sq .icon-sun{display:block;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
  .sq .icon-moon{display:none;fill:currentColor}
  [data-theme="dark"] .sq .icon-sun{display:none}
  [data-theme="dark"] .sq .icon-moon{display:block}

  .wrap{
    position:relative;z-index:2;width:100%;max-width:440px;margin:0 auto;
    padding:16px 20px calc(48px + env(safe-area-inset-bottom));
  }

  .hero{text-align:center;margin-bottom:8px}
  .hero h1{font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.1;letter-spacing:-1px;font-weight:800;text-wrap:balance}
  .hl{
    display:inline-block;background:var(--orange);color:var(--dark);padding:0 .18em;margin:0 .04em;
    border:var(--bw) solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg);
  }
  .hero p{margin-top:12px;font:400 .82rem "DM Mono",monospace;color:var(--mut);letter-spacing:.3px}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0 20px}
  .tab{
    display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;
    background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:16px;
    font-family:inherit;font-weight:800;font-size:.85rem;cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s;
  }
  .tab svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .tab:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
  .tab:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  .tab.active{background:var(--orange);color:var(--dark);transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}

  .panel{display:flex;flex-direction:column;gap:14px}
  .panel[hidden]{display:none}

  .pure-card{
    display:flex;align-items:center;gap:14px;padding:16px;
    background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:var(--r);
    text-decoration:none;box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s,box-shadow .12s;
  }
  .pure-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
  .pure-card:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  .pure-icon{
    flex:none;width:52px;height:52px;border-radius:14px;
    background:var(--orange);color:var(--dark);
    border:var(--bw) solid var(--ink);
    display:grid;place-items:center;font-weight:900;font-size:1.05rem;letter-spacing:.5px;
  }
  .pure-icon svg{width:26px;height:26px;fill:currentColor}
  .pure-info{flex:1;min-width:0;text-align:left}
  .pure-info b{display:block;font-size:1.08rem;line-height:1.15;font-weight:800}
  .pure-info small{display:block;margin-top:4px;font:500 .74rem "DM Mono",monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pure-arr{
    flex:none;width:34px;height:34px;border-radius:50%;
    background:var(--yellow);color:var(--dark);border:var(--bw) solid var(--ink);
    display:grid;place-items:center;
  }
  .pure-arr svg{width:16px;height:16px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .source-card{
    padding:16px;background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);border-radius:var(--r);
    box-shadow:5px 5px 0 var(--ink);text-align:left;
  }
  .source-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed var(--ink);
  }
  .source-head h3{font-size:1.1rem;line-height:1.2;font-weight:800}
  .source-head small{display:block;margin-top:4px;font:500 .74rem "DM Mono",monospace;color:var(--mut)}
  .tag{
    flex:none;font:800 .58rem "DM Mono",monospace;letter-spacing:.5px;
    background:var(--ink);color:var(--yellow);padding:4px 7px;border-radius:6px;align-self:flex-start;
  }
  .source-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{
    display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;
    border:var(--bw) solid var(--ink);border-radius:12px;
    font-family:inherit;font-weight:800;font-size:.8rem;
    text-decoration:none;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
  }
  .act svg{width:15px;height:15px;flex:none;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .act.prev{background:var(--yellow);color:var(--dark)}
  .act.dl{background:var(--blue);color:#fff}
  .act:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .act:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

  .empty{
    padding:32px 16px;text-align:center;
    border:var(--bw) dashed var(--ink);border-radius:var(--r);
    color:var(--mut);font:500 .82rem "DM Mono",monospace;opacity:.7;
  }
  footer{
    margin-top:38px;text-align:center;
    font:500 .7rem "DM Mono",monospace;letter-spacing:1.2px;
    color:var(--mut);text-transform:uppercase;
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);
    z-index:9;opacity:0;pointer-events:none;
    background:var(--yellow);color:var(--dark);
    border:var(--bw) solid var(--ink);padding:9px 16px;border-radius:12px;
    box-shadow:4px 4px 0 var(--ink);font:500 .8rem "DM Mono",monospace;
    transition:.3s cubic-bezier(.2,.9,.3,1.3);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) var(--d,0s) backwards}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}

  a:focus-visible,button:focus-visible{outline:var(--bw) solid var(--blue);outline-offset:3px}

  @media (max-width:400px){
    .topbar{gap:8px;padding:14px 16px 6px}
    .back span{display:none}
    .back{padding:0 10px}
    .join{font-size:.72rem;letter-spacing:.3px}
    .join svg{width:15px;height:15px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

<header class="topbar">
  <a class="back" href="https://adfayafathinarya.my.id">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Kembali</span>
  </a>

  <a class="join" href="https://whatsapp.com/channel/0029Vb94ZxHBadmday3k9Q0I" target="_blank" rel="noopener" aria-label="Channel Resmi WA">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4.1c1.7.7 2.3.8 3.1.7a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
    <span class="txt">Channel Resmi WA</span>

  <button class="sq" id="tema" aria-label="Ganti tema">

    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>

</header>

<main class="wrap">
  <div class="hero">
    <h1 id="judul"></h1>
    <p id="sub"></p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="murni" role="tab" aria-controls="panel-murni">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
      Web Murni
    </button>
    <button class="tab" data-tab="source" role="tab" aria-controls="panel-source">
      <svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
      Source Code
    </button>
  </div>

  <section class="panel" id="panel-murni" role="tabpanel">
    <div id="grid-murni" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <section class="panel" id="panel-source" role="tabpanel" hidden>
    <div id="grid-source" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <footer id="footer"></footer>
</main>

<div class="toast" id="toast"></div>

<script id="config">
const CONFIG = {
  judul: "Kumpulan Link Arya",
  sorot: "Link",
  sub: "Web murni & source code buatan Arya Fox",
  ticker: "KUMPULAN LINK ARYA ✦ WEB MURNI ✦ SOURCE CODE ✦ BY ARYA FOX ✦ ",
  tema: "light",

  webMurni: [
    { nama: "Downloader", sub: "aryadonwloader.my.id", url: "https://aryadonwloader.my.id", ikon: "⬇" }
  ],

  sourceCode: [
    { nama: "Profil Neubrutalism", sub: "Template link-in-bio neubrutalism", tag: "HTML", preview: "https://aryadevoloper.github.io/sourcecode/Source%20Code/ProfilNeubrutalism.html", download: "https://www.mediafire.com/file/2oqra0e6z7leybn/ProfilNeubrutalism.html/file" },
    { nama: "Profil Aurora Glass", sub: "Template link-in-bio aurora glass", tag: "HTML", preview: "https://aryadevoloper.github.io/sourcecode/Source%20Code/ProfilAuroraGlass.html", download: "https://www.mediafire.com/file/fkk2ic5dt9o2705/ProfilAuroraGlass.html/file" }
  ]
};
</script>

<script>
(function () {
  'use strict';
  var C = CONFIG, root = document.documentElement;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function url(u) { u = String(u || '').trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(u) ? esc(u) : '#'; }
  function col(v) { return String(v || '').replace(/[^#a-zA-Z0-9(),.%\s-]/g, ''); }

  document.title = C.judul;
  var judul = String(C.judul || ''), s = String(C.sorot || ''), k = s ? judul.lastIndexOf(s) : -1;
  $('#judul').innerHTML = k < 0 ? esc(judul) : esc(judul.slice(0, k)) + '<span class="hl">' + esc(s) + '</span>' + esc(judul.slice(k + s.length));
  $('#sub').textContent = C.sub || '';
  if (!C.sub) $('#sub').style.display = 'none';

  var tk = String(C.ticker || ''), n = tk ? Math.max(1, Math.ceil(140 / tk.length)) : 0;
  var rep = '<span>' + esc(new Array(n + 1).join(tk)) + '</span>';
  $('#track').innerHTML = rep + rep;
  if (!tk) $('.ticker').style.display = 'none';

  var WA_URL = String(C.channelWA || '').trim();
  var WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4.1c1.7.7 2.3.8 3.1.7a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>';

  var wm = (C.webMurni || []).slice();
  if (WA_URL && !wm.some(function (x) { return String(x.url || '').trim() === WA_URL; })) {
    wm.unshift({
      nama: "Channel Resmi WA",
      sub: "Saluran WhatsApp Arya Fox",
      url: WA_URL,
      svg: WA_ICON,
      warna: "#25d366"
    });
  }

  var ARR = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  $('#grid-murni').innerHTML = wm.length ? wm.map(function (x, i) {
    var iconStyle = x.warna ? ' style="background:' + col(x.warna) + ';color:#14110f"' : '';
    var iconContent = x.svg ? x.svg : esc(x.ikon || '◆');
    return '<a class="pure-card pop" style="--d:' + (0.05 * i).toFixed(2) + 's" href="' + url(x.url) + '" target="_blank" rel="noopener">' +
      '<span class="pure-icon"' + iconStyle + '>' + iconContent + '</span>' +
      '<span class="pure-info"><b>' + esc(x.nama) + '</b>' + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</span>' +
      '<span class="pure-arr">' + ARR + '</span></a>';
  }).join('') : '<div class="empty">Belum ada web murni</div>';

  var PREV = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  var sc = C.sourceCode || [];
  $('#grid-source').innerHTML = sc.length ? sc.map(function (x, i) {
    return '<div class="source-card pop" style="--d:' + (0.05 * i).toFixed(2) + 's">' +
      '<div class="source-head">' +
        '<div><h3>' + esc(x.nama) + '</h3>' + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</div>' +
        (x.tag ? '<span class="tag">' + esc(x.tag) + '</span>' : '') +
      '</div>' +
      '<div class="source-btns">' +
        '<a class="act prev" href="' + url(x.preview) + '" target="_blank" rel="noopener">' + PREV + ' Preview</a>' +
        '<a class="act dl" href="' + url(x.download) + '" target="_blank" rel="noopener">' + DL + ' Download</a>' +
      '</div></div>';
  }).join('') : '<div class="empty">Belum ada source code</div>';

  function setTab(id) {
    document.querySelectorAll('.tab').forEach(function (t) {
      var on = t.dataset.tab === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.panel').forEach(function (p) {
      p.hidden = p.id !== 'panel-' + id;
    });
    try { localStorage.setItem('tab', id); } catch (e) {}
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { setTab(t.dataset.tab); });
  });
  var initTab = 'murni';
  try {
    var saved = localStorage.getItem('tab');
    if (saved === 'murni' || saved === 'source') initTab = saved;
  } catch (e) {}
  setTab(initTab);

  $('#footer').textContent = '© ' + new Date().getFullYear() + ' Arya Fox';

  function setMeta() { $('meta[name=theme-color]').content = root.dataset.theme === 'dark' ? '#14110f' : '#ff7a1a'; }
  root.dataset.theme = C.tema === 'dark' ? 'dark' : 'light';
  try { var tsim = localStorage.getItem('tema'); if (tsim === 'dark' || tsim === 'light') root.dataset.theme = tsim; } catch (e) {}
  setMeta();
  $('#tema').addEventListener('click', function () {
    var baru = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = baru; setMeta();
    try { localStorage.setItem('tema', baru); } catch (e) {}
  });

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.sq, .tab, .act, .pure-card, .back, .join') && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (x) {}
    }
  });
  function pos(e) { root.style.setProperty('--px', e.clientX + 'px'); root.style.setProperty('--py', e.clientY + 'px'); }
  addEventListener('pointermove', pos);
  addEventListener('pointerdown', pos);
})();
</script>
</body>
